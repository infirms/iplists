name: Update lists

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-lists
  cancel-in-progress: false

env:
  SING_BOX_VERSION: "1.13.21"
  SING_BOX_SHA256: "24f9ef8e7234e13e71e74c3598a4164c5fe07b7b67ccc6e96cf68b54789f72cd"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      - name: Install sing-box
        run: |
          set -euo pipefail
          archive="sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          curl --fail --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${archive}"
          printf '%s  %s\n' "$SING_BOX_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/sing-box"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/sing-box" --strip-components=1
          echo "$RUNNER_TEMP/sing-box" >> "$GITHUB_PATH"

      - name: Generate rule sets
        run: python -m iplists

      - name: Commit changed lists
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add -A -- output/sing-box
          if git diff --cached --quiet; then
            echo "Lists are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(iplists): update generated lists"
          git push origin "HEAD:${DEFAULT_BRANCH}"
